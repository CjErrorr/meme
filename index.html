<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>A Special Question 💕</title>
</head>
<body class="flex min-h-screen items-center justify-center overflow-hidden bg-rose-100 p-5 [font-family:'Comic_Sans_MS','Chalkboard_SE',cursive]">
  <main class="card relative z-10 w-full max-w-[420px] rounded-[25px] border-4 border-rose-300 bg-white p-7 text-center shadow-[0_10px_25px_rgba(255,182,193,0.6)] sm:p-10">
    <section id="screen-1" class="screen">
      <h1 class="mb-6 text-3xl font-bold text-rose-500">How are you today, my love? 🌸</h1>
      <div class="mb-6 flex min-h-[180px] items-center justify-center">
        <img class="max-h-[200px] max-w-full rounded-2xl" src="Img/dog.jpg" alt="Cute dog">
      </div>
      <div class="btn-group relative flex min-h-[50px] justify-center gap-4">
        <button class="rounded-full bg-rose-400 px-6 py-3 text-lg font-bold text-white shadow-lg shadow-rose-300/60 transition hover:scale-105 hover:bg-rose-500" onclick="goToScreen('screen-3')">I'm fine ✨</button>
        <button class="rounded-full bg-rose-400 px-6 py-3 text-lg font-bold text-white shadow-lg shadow-rose-300/60 transition hover:scale-105 hover:bg-rose-500" onclick="goToScreen('screen-2')">I'm not 🥺</button>
      </div>
    </section>

    <section id="screen-2" class="screen hidden">
      <h1 class="mb-6 text-3xl font-bold text-rose-500">Cheer Up Baby! ❤️🐱</h1>
      <div class="mb-6 flex min-h-[180px] items-center justify-center">
        <img class="max-h-[200px] max-w-full rounded-2xl" src="Img/laughing dog.gif" alt="Laughing dog">
      </div>
      <div class="btn-group relative flex min-h-[50px] justify-center gap-4">
        <button class="rounded-full bg-rose-400 px-6 py-3 text-lg font-bold text-white shadow-lg shadow-rose-300/60 transition hover:scale-105 hover:bg-rose-500" onclick="goToScreen('screen-3')">Next ❤️</button>
      </div>
    </section>

    <section id="screen-3" class="screen hidden">
      <h1 class="mb-6 text-3xl font-bold text-rose-500">Do you love me? 💖</h1>
      <div class="mb-6 flex min-h-[180px] items-center justify-center">
        <img class="max-h-[200px] max-w-full rounded-2xl" src="Img/scuba.gif" alt="Scuba cat">
      </div>
      <div class="btn-group relative flex min-h-[50px] justify-center gap-4">
        <button class="rounded-full bg-rose-400 px-6 py-3 text-lg font-bold text-white shadow-lg shadow-rose-300/60 transition hover:scale-105 hover:bg-rose-500" onclick="goToScreen('screen-4')">Yes! 💕</button>
        <button id="no-btn" class="rounded-full bg-rose-400 px-6 py-3 text-lg font-bold text-white shadow-lg shadow-rose-300/60 transition-all duration-150 hover:scale-105 hover:bg-rose-500" onmouseenter="dodgeNo()">No 😜</button>
      </div>
    </section>

    <section id="screen-4" class="screen hidden">
      <h1 class="mb-6 text-3xl font-bold text-rose-500">I love you more too! 🥰</h1>
      <div class="mb-3 flex min-h-[180px] items-center justify-center">
        <img class="max-h-[200px] max-w-full rounded-2xl" src="Img/dog smiling.gif" alt="Smiling dog">
      </div>
      <p class="mt-2 text-xl font-bold text-rose-500">Keep safe, see you! 💖✨</p>
      <button class="mt-5 rounded-full bg-rose-400 px-6 py-3 text-lg font-bold text-white shadow-lg shadow-rose-300/60 transition hover:scale-105 hover:bg-rose-500" onclick="goToScreen('screen-1')">Try again 💕</button>
    </section>
  </main>

  <script src="JS/script.js"></script>
</body>
</html>
