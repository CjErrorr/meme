<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="../Css/Style.css">
  <title>A Special Question 💕</title>
  
</head>
<body>

  <div class="card">
    <!-- SCREEN 1: How are you today? -->
    <div id="screen-1" class="screen active">
      <h1>How are you today, my love? 🌸</h1>
      <div class="media-container">
        <img src="../Img/dog.jpg" alt="Cute gif">
      </div>
      <div class="btn-group">
        <button onclick="goToScreen('screen-3')">I'm fine ✨</button>
        <button onclick="goToScreen('screen-2')">I'm not 🥺</button>
      </div>
    </div>

    <!-- SCREEN 2: Scuba Cat Meme -->
    <div id="screen-2" class="screen">
      <h1>Cheer Up Baby!❤️🐱</h1>
      <div class="media-container">
        <img src="../Img/laughing dog.gif" alt="Scuba Cat" id="scuba-cat">
      </div>
      <div class="btn-group">
        <button onclick="goToScreen('screen-3')">Next ❤️</button>
      </div>
    </div>

    <!-- SCREEN 3: Do you love me? -->
    <div id="screen-3" class="screen">
      <h1>Do you love me? 💖</h1>
      <div class="media-container">
        <img src="" alt="Puppy eyes cat">
      </div>
      <div class="btn-group" id="love-btn-group">
        <button id="yes-btn" onclick="goToScreen('screen-4')">Yes! 💕</button>
        <button id="no-btn" onmouseover="dodgeNo()" onclick="dodgeNo()">No 😜</button>
      </div>
    </div>

    <!-- SCREEN 4: Final Message -->
    <div id="screen-4" class="screen">
      <h1>I love you more too! 🥰</h1>
      <div class="media-container">
        <img src="../Img/scuba.gif" alt="Love gif">
      </div>
      <p style="color: #ff4d6d; font-size: 1.2rem; font-weight: bold; margin-top: 10px;">
        Keep safe, see you! 💖✨
      </p>
    </div>
  </div>

  <script>
    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      // Reset the "No" button position if returning/entering Screen 3
      if (screenId === 'screen-3') {
        const noBtn = document.getElementById('no-btn');
        noBtn.style.position = 'static';
      }
    }

    function dodgeNo() {
      const noBtn = document.getElementById('no-btn');
      const card = document.querySelector('.card');
      
      // Calculate random coordinates inside the card container
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = cardRect.width - btnRect.width - 40;
      const maxY = cardRect.height - btnRect.height - 40;

      const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
      const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

      noBtn.style.position = 'absolute';
      noBtn.style.left = `calc(50% + ${randomX}px)`;
      noBtn.style.top = `calc(50% + ${randomY}px)`;
    }
  </script>
</body>
</html>
